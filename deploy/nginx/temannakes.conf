# Host nginx site for TemanNakes. Install on the VPS as
#   /etc/nginx/sites-available/temannakes  (+ symlink in sites-enabled)
# then run certbot to add HTTPS (it edits this file in place). See DEPLOY.md.
server {
    listen 80;
    listen [::]:80;
    server_name temannakes.aisatira.web.id;

    # Evidence photos/PDFs and letterheads; matches serverActions.bodySizeLimit.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # PDF rendering can take a few seconds on a small VPS.
        proxy_read_timeout 60s;
    }
}
